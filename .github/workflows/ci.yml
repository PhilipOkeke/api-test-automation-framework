name: API Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out test framework
        uses: actions/checkout@v6

      - name: Check out TaskFlow API
        uses: actions/checkout@v6
        with:
          repository: philip-okeke/taskflow-api
          path: system-under-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install framework and API
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./system-under-test

      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Start TaskFlow API
        env:
          DATABASE_URL: sqlite:///./ci-taskflow.db
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/taskflow-api.log 2>&1 &
          python scripts/wait_for_api.py

      - name: Run automated tests
        run: |
          pytest \
            --html=reports/api-test-report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: reports/
          if-no-files-found: warn

